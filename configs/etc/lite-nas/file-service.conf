[http]
address=127.0.0.1:8082

[messaging]
url=tls://127.0.0.1:4222
client_name=file-service
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-file-service/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-file-service/client.key
timeout=5s

[filesystem]
write_roots=/home
protected_paths=

[uploads]
metadata_dir=/var/lib/lite-nas/file-service/uploads
chunk_size_mib=1

[api_docs]
enabled=false

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/file-service.log
