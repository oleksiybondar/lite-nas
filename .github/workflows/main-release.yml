          retention-days: 1

  test-release-package:
    name: LiteNAS package system tests (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - build-release-package
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated LiteNAS package
        uses: actions/download-artifact@v4
        with:
          name: lite-nas-deb-${{ matrix.arch }}
          path: .build/packages/${{ matrix.arch }}

      - name: Install package test dependencies
        run: scripts/ci/install-debian-packaging-dependencies.sh

      - name: Prepare package diagnostic log directory
        run: mkdir -p .build/package-ci-logs/${{ matrix.arch }}

      - name: Install LiteNAS package on runner for system tests
        run: |
          set -o pipefail
          sudo env DEBIAN_FRONTEND=noninteractive \
            scripts/package/install-lite-nas-deb.sh \
              --package .build/packages/${{ matrix.arch }}/lite-nas_*.deb \
              --no-install-recommends \
              2>&1 | tee .build/package-ci-logs/${{ matrix.arch }}/install-package.log

      - name: Collect package diagnostics on failure
        if: ${{ failure() }}
        run: |
          sudo bash scripts/ci/collect-package-diagnostics.sh \
            --output-dir .build/package-ci-logs/${{ matrix.arch }}/diagnostics

      - name: Upload package diagnostics on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: package-diagnostics-${{ matrix.arch }}
          path: .build/package-ci-logs/${{ matrix.arch }}
          if-no-files-found: warn
          retention-days: 15

      - name: Install Python and Playwright dependencies
        if: ${{ matrix.arch == 'amd64' }}
        run: scripts/ci/install-python-dependencies.sh

      - name: Prepare Python test users
        if: ${{ matrix.arch == 'amd64' }}
        env:
          LITENAS_API_LOGIN: testuser
          LITENAS_API_PASSWORD: testpassword
          LITENAS_OPERATOR_LOGIN: testoperator
          LITENAS_SECURITY_LOGIN: testsecurity
          LITENAS_FILE_SERVICE_ADMIN_LOGIN: testadmin
          LITENAS_FILE_SERVICE_ADMIN_PASSWORD: testpassword
          LITENAS_TEST_PASSWORD: testpassword
        run: scripts/ci/prepare-system-test-users.sh

      - name: Prepare restricted sudo system-test user
        if: ${{ matrix.arch == 'amd64' }}
        env:
          LITENAS_TESTSUDO_LOGIN: testsudouser
          LITENAS_TESTSUDO_PASSWORD: testpassword
          LITENAS_SYSTEM_LOGGING_MANAGER_CLI_BINARY: /usr/bin/system-logging-manager-cli
          LITENAS_SECURITY_LOGGING_MANAGER_CLI_BINARY: /usr/bin/security-logging-manager-cli
        run: scripts/ci/prepare-system-test-sudo-user.sh

      - name: Prepare loopback SSH authentication tests
        if: ${{ matrix.arch == 'amd64' }}
        run: sudo bash scripts/ci/prepare-system-test-ssh.sh

      - name: Verify CI system-test users
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          id testuser
          id testoperator
          id testsecurity
          id testsudouser
          id testadmin
          id testpasswduser

      - name: Diagnose installed LiteNAS routing
        if: ${{ matrix.arch == 'amd64' }}
        run: |
          systemctl is-enabled nginx nats-server lite-nas-auth lite-nas-system-metrics lite-nas-service-metrics lite-nas-web-gateway lite-nas-file-service lite-nas-stream-service lite-nas-mount-monitor lite-nas-antivirus lite-nas-system-service-monitor lite-nas-service-watchdog lite-nas-services-manager lite-nas-session-manager lite-nas-journal-manager lite-nas-log-analysis lite-nas-security-automation
          systemctl is-active nginx nats-server lite-nas-auth lite-nas-system-metrics lite-nas-service-metrics lite-nas-web-gateway lite-nas-file-service lite-nas-stream-service lite-nas-mount-monitor lite-nas-antivirus lite-nas-system-service-monitor lite-nas-service-watchdog lite-nas-services-manager lite-nas-session-manager lite-nas-journal-manager lite-nas-log-analysis lite-nas-security-automation
          sudo nginx -t
          sudo nginx -T | sed -n '1,220p'
          curl -skS -o /dev/null -w "%{http_code}\n" https://localhost/api/auth/login
          curl -sS -o /dev/null -w "%{http_code}\n" http://127.0.0.1:9090/api/auth/login

      - name: Verify host manager confinement
        if: ${{ matrix.arch == 'amd64' }}
        run: sudo scripts/ci/verify-host-manager-installation.sh

      - name: Test installed LiteNAS package
        if: ${{ matrix.arch == 'amd64' }}
        env:
          LITENAS_API_LOGIN: testuser
          LITENAS_API_PASSWORD: testpassword
          LITENAS_OPERATOR_LOGIN: testoperator
          LITENAS_SECURITY_LOGIN: testsecurity
          LITENAS_TEST_PASSWORD: testpassword
          LITENAS_FILE_SERVICE_ADMIN_LOGIN: testadmin
          LITENAS_FILE_SERVICE_ADMIN_PASSWORD: testpassword
          LITENAS_TESTSUDO_LOGIN: testsudouser
          LITENAS_TESTSUDO_PASSWORD: testpassword
        run: scripts/test-python.sh

      - name: Archive system test logs
        if: ${{ matrix.arch == 'amd64' && always() }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile

          source = Path("tests/logs")
          archive = Path("system_tests_logs.zip")
          log_files = sorted(path for path in source.rglob("*") if path.is_file()) if source.exists() else []

          with ZipFile(archive, "w", ZIP_DEFLATED) as zip_file:
              for log_file in log_files:
                  zip_file.write(log_file, log_file.relative_to(source.parent))
              if not log_files:
                  zip_file.writestr("logs/.empty", "No system test logs were produced.\n")
          PY

      - name: Upload system test logs
        if: ${{ matrix.arch == 'amd64' && always() }}
        uses: actions/upload-artifact@v4
        with:
          name: system-test-logs-${{ matrix.arch }}
          path: system_tests_logs.zip
          if-no-files-found: warn
          retention-days: 15


  release-compliance:
    name: LiteNAS before and after OpenSCAP assessment (amd64)
    runs-on: ubuntu-24.04
    needs:
      - build-release-package
    timeout-minutes: 180
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download validated LiteNAS package
        uses: actions/download-artifact@v4
        with:
          name: lite-nas-deb-amd64
          path: .build/packages/amd64

      - name: Scan before and after installing LiteNAS
        run: bash scripts/ci/run-openscap-release-delta.sh .build/packages/amd64/lite-nas_*.deb

      - name: Store OpenSCAP scans and delta report
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: openscap-release-delta-amd64
          path: .build/openscap-release-delta
          if-no-files-found: warn
          retention-days: 30
