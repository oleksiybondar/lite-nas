[analysis]
rules_file=/etc/lite-nas/log-analysis/rules.json
# Accounts rsyslogd may run as; datagrams from any other sender are rejected.
# Ubuntu runs rsyslogd as syslog, Debian as root. Missing accounts are skipped.
sender_users=syslog,root

[messaging]
url=tls://127.0.0.1:4222
client_name=log-analysis
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-log-analysis/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-log-analysis/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-log-analysis/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-log-analysis/client.key
service_name=log-analysis
service_login=lite-nas-log-analysis

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/log-analysis.log
