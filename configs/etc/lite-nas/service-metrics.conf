[metrics]
poll_interval=5s
history_size=10

[messaging]
url=tls://127.0.0.1:4222
client_name=service-metrics
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-service-metrics/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-service-metrics/client.key
timeout=5s

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/service-metrics.log
