# LiteNAS Log Analysis ingress.
#
# rsyslog forwards selected records as one JSON object per datagram to the
# Unix datagram socket owned by lite-nas-log-analysis.socket. Log Analysis
# accepts datagrams only from the rsyslog process identity and rejects any
# field that is not part of this template, so keep the template and the Go
# record contract in services/log-analysis/parser.go aligned.
#
# To process more records, extend the selection condition below and then add
# a matching source (facilities, inputs or programs) and rules to
# /etc/lite-nas/log-analysis/rules.json. Records that no source selects are
# ignored by Log Analysis.

module(load="omuxsock")

template(name="LiteNASLogAnalysisRecord" type="list" option.jsonf="on") {
	property(outname="timestamp" name="timereported" dateFormat="rfc3339" format="jsonf")
	property(outname="facility" name="syslogfacility-text" format="jsonf")
	property(outname="input" name="inputname" format="jsonf")
	property(outname="program" name="programname" format="jsonf")
	property(outname="message" name="msg" format="jsonf")
}

# Forwarded selection: authentication facilities and records read by imklog.
# Kernel records are selected by input module, not by facility, because a
# local process can claim the kern facility but cannot claim inputname imklog.
if ($syslogfacility-text == "auth" or $syslogfacility-text == "authpriv" or $inputname == "imklog") then {
	# The disk-assisted queue keeps records while Log Analysis restarts or is
	# down. A zero enqueue timeout drops only this forwarding action's records
	# when the queue is exhausted, so host logging is never stalled by it.
	action(
		type="omuxsock"
		name="lite-nas-log-analysis"
		socketName="/run/lite-nas-log-analysis/rsyslog.sock"
		template="LiteNASLogAnalysisRecord"
		queue.type="LinkedList"
		queue.size="10000"
		queue.filename="lite-nas-log-analysis"
		queue.maxDiskSpace="64m"
		queue.saveOnShutdown="on"
		queue.timeoutEnqueue="0"
		action.resumeRetryCount="-1"
		action.resumeInterval="1"
	)
}
