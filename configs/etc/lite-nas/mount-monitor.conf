[mounts]
poll_interval=5s

[messaging]
url=tls://127.0.0.1:4222
client_name=mount-monitor
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-mount-monitor/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-mount-monitor/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-mount-monitor/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-mount-monitor/client.key
service_name=mount-monitor
service_login=lite-nas-mount-monitor

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/mount-monitor.log
