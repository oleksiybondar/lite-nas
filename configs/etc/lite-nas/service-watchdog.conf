[watchdog]
poll_interval=10s
recovery_delay=30s
backoff=1m
max_attempts=3
units=systemd-journald.service,apparmor.service,usbguard.service,ufw.service,lite-nas-auth.service,lite-nas-rbac.service,lite-nas-security-logging-manager.service,lite-nas-system-logging-manager.service,lite-nas-security-email-notifier.service,lite-nas-system-email-notifier.service,lite-nas-system-metrics.service,lite-nas-network-metrics.service,lite-nas-process-metrics.service,lite-nas-disk-metrics.service,lite-nas-service-metrics.service,lite-nas-zfs-metrics.service,lite-nas-resources-monitor.service,lite-nas-integrity.service,lite-nas-mount-monitor.service,lite-nas-antivirus.service,lite-nas-system-service-monitor.service,lite-nas-log-analysis.service

[unit.systemd-journald.service]
expected_enablement=static
recover=true
critical=true

[unit.apparmor.service]
expected_enablement=enabled
recover=true
critical=true

[unit.usbguard.service]
expected_enablement=enabled
recover=true
critical=true

[unit.ufw.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-auth.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-rbac.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-security-logging-manager.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-system-logging-manager.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-security-email-notifier.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-system-email-notifier.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-system-metrics.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-network-metrics.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-process-metrics.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-disk-metrics.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-service-metrics.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-zfs-metrics.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-resources-monitor.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-integrity.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-mount-monitor.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-antivirus.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-system-service-monitor.service]
expected_enablement=enabled
recover=true
critical=true

[unit.lite-nas-log-analysis.service]
expected_enablement=enabled
recover=true
critical=true
[messaging]
url=tls://127.0.0.1:4222
client_name=service-watchdog
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-service-watchdog/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-service-watchdog/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-service-watchdog/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-service-watchdog/client.key
service_name=service-watchdog
service_login=lite-nas-service-watchdog

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/service-watchdog.log
