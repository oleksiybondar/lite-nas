[automation]
mode=permissive
rules_file=/etc/lite-nas/security-automation/rules.json

[messaging]
url=tls://127.0.0.1:4222
client_name=security-automation
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-security-automation/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-security-automation/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-security-automation/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-security-automation/client.key
service_name=security-automation
service_login=lite-nas-security-automation

[auth_tokens]
issuer=lite-nas-auth
audience=lite-nas-management-api
access_lifetime=15m
clock_skew=30s
verification_cert=/etc/lite-nas/certificates/auth/token-signing.crt

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/security-automation.log
