# Included in the admin host when the Moments assets are installed.
location = /apps/moments {
    return 308 /apps/moments/;
}

location ^~ /apps/moments/assets/ {
    alias /usr/share/lite-nas/moments/assets/;
    try_files $uri =404;
}

# Keep the embedded app's API separate from the admin gateway's /api routes.
location ^~ /apps/moments/api/ {
    rewrite ^/apps/moments/api/(.*)$ /api/$1 break;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $lite_nas_browser_proto;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_pass http://lite_nas_moments;
}

location ^~ /apps/moments/ {
    alias /usr/share/lite-nas/moments/;
    add_header Cache-Control no-store always;
    # Browser routes such as /apps/moments/galleries/<id> load the app entry point.
    try_files $uri $uri/ /apps/moments/index.html;
}
