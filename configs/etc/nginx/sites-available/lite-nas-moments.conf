upstream lite_nas_moments {
    server 127.0.0.1:9091;
    keepalive 16;
}

# Loopback origin supports a Cloudflare tunnel without binding a public HTTP port.
server {
    listen 127.0.0.1:80;
    server_name moments.localhost ~^moments\..+$;

    include /etc/nginx/snippets/lite-nas-file-service.conf;

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $lite_nas_browser_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://lite_nas_moments;
    }

    location / {
        root /usr/share/lite-nas/moments;
        try_files $uri $uri/ /index.html;
    }
}

server {
    listen 443 ssl;
    server_name moments.localhost ~^moments\..+$;

    ssl_certificate /etc/lite-nas/certificates/nginx/moments.crt;
    ssl_certificate_key /etc/lite-nas/certificates/nginx/moments.key;
    ssl_protocols TLSv1.2 TLSv1.3;

    include /etc/nginx/snippets/lite-nas-file-service.conf;

    location ^~ /api/ {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $lite_nas_browser_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Connection "";
        proxy_pass http://lite_nas_moments;
    }

    location / {
        root /usr/share/lite-nas/moments;
        try_files $uri $uri/ /index.html;
    }
}
