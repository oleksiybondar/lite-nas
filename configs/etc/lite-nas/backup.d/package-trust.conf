[backup]
plugin=file
restart_units=

[file.apt-config]
path=/etc/apt/apt.conf
optional=true

[directory.apt-config-dropins]
path=/etc/apt/apt.conf.d
optional=true

[file.sources]
path=/etc/apt/sources.list
optional=true

[directory.sources-dropins]
path=/etc/apt/sources.list.d
optional=true

[file.preferences]
path=/etc/apt/preferences
optional=true

[directory.preferences-dropins]
path=/etc/apt/preferences.d
optional=true

[file.legacy-keyring]
path=/etc/apt/trusted.gpg
optional=true

[directory.legacy-keyrings]
path=/etc/apt/trusted.gpg.d
optional=true

[directory.keyrings]
path=/etc/apt/keyrings
optional=true
