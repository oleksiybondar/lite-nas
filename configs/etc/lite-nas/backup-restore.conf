[messaging]
url=tls://127.0.0.1:4222
client_name=backup-restore
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-backup-restore/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-backup-restore/client.key
timeout=30s

[auth_tokens]
issuer=lite-nas-auth
audience=lite-nas-management-api
access_lifetime=15m
clock_skew=30s
verification_cert=/etc/lite-nas/certificates/auth/token-signing.crt

[backup]
spec_dir=/etc/lite-nas/backup.d
store_root=/var/lib/lite-nas/backup

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/backup-restore.log
