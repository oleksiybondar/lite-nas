[AIDE]
schedule=24

[messaging]
url=tls://127.0.0.1:4222
client_name=litenas-integrity
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-integrity/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-integrity/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-integrity/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-integrity/client.key
service_name=litenas-integrity
service_login=lite-nas-integrity

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/lite-nas-integrity.log
