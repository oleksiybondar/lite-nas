[port_scan]
distinct_ports=12
window=2m
cooldown=30m
max_pairs=4096
mitigate=Review the source address and targeted ports. Confirm whether the scan was authorized, then restrict the source if the activity is hostile.

[horizontal_scan]
threshold=12
window=2m
cooldown=30m
max_pairs=4096
mitigate=Review the source address and targeted destinations. Confirm whether the activity was authorized, then restrict the source if it is hostile.

[repeated_attempts]
threshold=12
window=2m
cooldown=30m
max_pairs=4096
mitigate=Review repeated blocked attempts from the source to the destination and port. Investigate the source and restrict it if the attempts are hostile.

[messaging]
url=tls://127.0.0.1:4222
client_name=network-security
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-network-security/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-network-security/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-network-security/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-network-security/client.key
service_name=network-security
service_login=lite-nas-network-security

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/network-security.log
