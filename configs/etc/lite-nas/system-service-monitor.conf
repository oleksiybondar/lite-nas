[monitor]
poll_interval=10s
units=lite-nas-auth.service,lite-nas-security-logging-manager.service,lite-nas-system-logging-manager.service,lite-nas-resources-monitor.service,lite-nas-integrity.service,lite-nas-mount-monitor.service,lite-nas-antivirus.service,lite-nas-log-analysis.service

[messaging]
url=tls://127.0.0.1:4222
client_name=system-service-monitor
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-system-service-monitor/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-system-service-monitor/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-system-service-monitor/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-system-service-monitor/client.key
service_name=system-service-monitor
service_login=lite-nas-system-service-monitor

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/system-service-monitor.log
