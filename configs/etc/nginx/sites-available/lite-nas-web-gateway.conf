upstream lite_nas_web_gateway {
    server 127.0.0.1:9090;
    keepalive 16;
}

# Cloudflare tunnel reaches loopback over HTTP while the browser used HTTPS.
map "$scheme:$http_x_forwarded_proto" $lite_nas_browser_proto {
    default $scheme;
    "http:https" https;
}

# Standalone Moments host uses the same file-service paths and its own API.
include /etc/nginx/sites-available/lite-nas-moments.conf;

server {
    # Loopback-only HTTP is kept for local origin clients such as cloudflared.
    # External HTTP remains blocked by firewall policy and is not a public entrypoint.
    listen 127.0.0.1:80;
    server_name localhost lite-nas;

    include /etc/nginx/snippets/lite-nas-file-service.conf;
    include /etc/nginx/snippets/lite-nas-moments-embedded.conf;
    include /usr/share/lite-nas/nginx/*.conf;

    location ~ ^/apps/file-explorer(?:/|$) {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $lite_nas_browser_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://lite_nas_web_gateway;
    }
}

server {
    listen 443 ssl;
    server_name localhost lite-nas lite-nas.local;

    ssl_certificate /etc/lite-nas/certificates/nginx/server.crt;
    ssl_certificate_key /etc/lite-nas/certificates/nginx/server.key;
    ssl_session_timeout 1d;
    ssl_session_cache shared:LiteNAS:10m;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;

    include /etc/nginx/snippets/lite-nas-file-service.conf;
    include /etc/nginx/snippets/lite-nas-moments-embedded.conf;
    include /usr/share/lite-nas/nginx/*.conf;

    location ~ ^/apps/file-explorer(?:/|$) {
        return 404;
    }

    location / {
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $lite_nas_browser_proto;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header Connection "";
        proxy_pass http://lite_nas_web_gateway;
    }
}
