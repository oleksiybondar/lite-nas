[automation]
rules_file=/etc/lite-nas/operational-safety-automation/rules.json

[messaging]
url=tls://127.0.0.1:4222
client_name=operational-safety-automation
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-ops-automation/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-ops-automation/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-ops-automation/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-ops-automation/client.key
service_name=operational-safety-automation
service_login=lite-nas-ops-automation

[auth_tokens]
issuer=lite-nas-auth
audience=lite-nas-management-api
access_lifetime=15m
clock_skew=30s
verification_cert=/etc/lite-nas/certificates/auth/token-signing.crt

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/operational-safety-automation.log
