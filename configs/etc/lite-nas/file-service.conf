[http]
address=127.0.0.1:8082

[messaging]
url=tls://127.0.0.1:4222
client_name=file-service
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-file-service/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-file-service/client.key
timeout=5s

[filesystem]
write_roots=/home
read_roots=/home
protected_paths=/bin,/boot,/dev,/etc,/lib,/lib64,/proc,/root,/run,/sbin,/sys,/usr,/var/lib
non_admin_denied_paths=/bin,/boot,/dev,/etc,/lib,/lib64,/proc,/root,/run,/sbin,/snap,/sys,/usr,/var
all_denied_paths=
known_path_directories=/home/*/.lite-nas
# Basename patterns hidden from /ls/ responses, including recursive listings.
listing_ignored_names=Thumbs.db,ehthumbs.db,thumbcache_*.db,desktop.ini,.DS_Store,._*,.AppleDouble,.Spotlight-V100,.Trashes,.fseventsd,.TemporaryItems,.directory,.hidden,.Trash,.Trash-*

[uploads]
metadata_dir=/var/lib/lite-nas/file-service/uploads
chunk_size_mib=1

[api_docs]
enabled=true

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/file-service.log
