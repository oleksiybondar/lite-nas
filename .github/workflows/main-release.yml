name: Main release

on:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  security-automation-test:
    name: Security automation tests and build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: services/security-automation/go.mod
          cache-dependency-path: services/security-automation/go.sum
      - name: Test security automation module
        run: scripts/test-security-automation.sh --with-coverage --minimum-coverage=75
      - name: Test security automation CLI
        run: scripts/ci/go-test-module.sh ./apps/security-automation-cli --with-coverage --minimum-coverage=75
      - name: Build security automation daemon
        run: scripts/build-security-automation-binary.sh --output=.build/security-automation/linux-${{ matrix.arch }}/security-automation
      - name: Build security automation CLI
        run: scripts/build-security-automation-cli-binary.sh --output=.build/security-automation-cli/linux-${{ matrix.arch }}/security-automation-cli
      - name: Upload security automation daemon
        uses: actions/upload-artifact@v4
        with:
          name: security-automation-linux-${{ matrix.arch }}
          path: .build/security-automation/linux-${{ matrix.arch }}/security-automation
          if-no-files-found: error
      - name: Upload security automation CLI
        uses: actions/upload-artifact@v4
        with:
          name: security-automation-cli-linux-${{ matrix.arch }}
          path: .build/security-automation-cli/linux-${{ matrix.arch }}/security-automation-cli
          if-no-files-found: error

  shared-go-build:
    name: Shared Go build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Shared Go build
        uses: ./.github/actions/shared-go-build-test
        with:
          run_tests: "false"

  service-build:
    name: ${{ matrix.component.name }} build (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    needs:
      - shared-go-build
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            component:
              name: Auth service
              artifact_name: auth-service-linux
              build_script: scripts/build-auth-service-binary.sh
              output_path: .build/auth-service/linux-amd64/auth-service
              apt_packages: gcc libc6-dev libpam0g-dev
          - arch: amd64
            runner: ubuntu-latest
            component:
