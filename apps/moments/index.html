<!doctype html>
<html lang="en"><head><meta charset="UTF-8"/><meta name="viewport" content="width=device-width, initial-scale=1.0"/><title>Moments</title><script>
  // Vite builds relative assets for both hosts; deep links need a mount-relative base.
  const base = document.createElement("base");
  base.href = location.pathname.startsWith("/apps/moments/") ? "/apps/moments/" : "/";
  document.head.append(base);
</script></head><body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body></html>
