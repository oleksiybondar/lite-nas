[backup]
plugin=file
restart_units=nats-server.service

[file.main]
path=/etc/nats-server.conf

[file.authorization]
path=/etc/nats-server/authorization.conf

[file.jetstream]
path=/etc/nats-server/jetstream.conf

[file.logging]
path=/etc/nats-server/logging.conf

[file.service]
path=/etc/nats-server/service.conf

[file.tls]
path=/etc/nats-server/tls.conf

[directory.server-certificates]
path=/etc/nats-server/certificates

[directory.transport-certificates]
path=/etc/lite-nas/certificates/transport

[directory.auth-certificates]
path=/etc/lite-nas/certificates/auth

[directory.identity-certificates]
path=/etc/lite-nas/certificates/identities
