[backup]
plugin=file
restart_units=lite-nas-security-automation.service

[file.main]
path=/etc/lite-nas/security-automation.conf

[file.transport-root-ca]
path=/etc/lite-nas/certificates/transport/root-ca.crt

[file.identity-root-ca]
path=/etc/lite-nas/certificates/identities/root-ca.crt

[directory.rules]
path=/etc/lite-nas/security-automation

[directory.transport-certificate]
path=/etc/lite-nas/certificates/transport/lite-nas-security-automation

[directory.identity-certificate]
path=/etc/lite-nas/certificates/identities/lite-nas-security-automation
