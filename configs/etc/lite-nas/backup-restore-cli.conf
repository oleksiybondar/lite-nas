[messaging]
url=tls://127.0.0.1:4222
client_name=backup-restore-cli
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-backup-restore-cli/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-backup-restore-cli/client.key
timeout=30s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-backup-restore-cli/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-backup-restore-cli/client.key
service_name=backup-restore-cli
service_login=lite-nas-backup-restore-cli

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/backup-restore-cli.log
