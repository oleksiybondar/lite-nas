[http]
address=127.0.0.1:9091
# Use the same parent domain configured for Web Gateway on production hosts.
cookie_domain=

[storage]
database_path=/var/lib/lite-nas/moments/moments.db
file_service_url=http://127.0.0.1:8082
thumbnail_dir=/var/lib/lite-nas/moments/thumbnails
# Initial folder shown by Moments file and folder pickers. Set to your media root.
working_dir=/home
# Packaged offline GeoNames cities; no runtime network lookup.
place_data_path=/usr/share/lite-nas/moments/cities1000.zip

[messaging]
url=tls://127.0.0.1:4222
client_name=moments
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-moments/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-moments/client.key
timeout=5s

[auth_tokens]
issuer=lite-nas-auth
audience=lite-nas-management-api
access_lifetime=15m
clock_skew=30s
verification_cert=/etc/lite-nas/certificates/auth/token-signing.crt
enforce_refresh_client_ip=false

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/moments.log
