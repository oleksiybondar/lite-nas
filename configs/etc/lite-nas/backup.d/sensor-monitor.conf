[backup]
plugin=file
restart_units=lite-nas-sensor-monitor.service

[file.config]
path=/etc/lite-nas/sensor-monitor.conf

[file.names]
path=/etc/lite-nas/sensor-names.json

[file.transport-root-ca]
path=/etc/lite-nas/certificates/transport/root-ca.crt

[directory.transport-certificate]
path=/etc/lite-nas/certificates/transport/lite-nas-sensor-monitor
