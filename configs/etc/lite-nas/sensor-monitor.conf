[sensors]
poll_interval=300ms
history_size=400
names_file=/etc/lite-nas/sensor-names.json
firmware_enabled=true
# Empty key lists select every discovered reading in that category.
temperature_keys=
voltage_keys=
fan_keys=
clock_keys=
throttling_keys=

[messaging]
url=tls://127.0.0.1:4222
client_name=sensor-monitor
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-sensor-monitor/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-sensor-monitor/client.key
timeout=5s

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/sensor-monitor.log
