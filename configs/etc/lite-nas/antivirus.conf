[scan]
fs_types=vfat,exfat,ntfs,ntfs3,ext4
mount_prefixes=/media,/mnt
timeout=30m

[messaging]
url=tls://127.0.0.1:4222
client_name=antivirus
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-antivirus/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-antivirus/client.key
timeout=5s

[auth]
ca=/etc/lite-nas/certificates/identities/root-ca.crt
cert=/etc/lite-nas/certificates/identities/lite-nas-antivirus/client.crt
key=/etc/lite-nas/certificates/identities/lite-nas-antivirus/client.key
service_name=antivirus
service_login=lite-nas-antivirus

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/antivirus.log
