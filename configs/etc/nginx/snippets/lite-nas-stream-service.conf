# The trailing slash strips /s/ while preserving the absolute host-path suffix.
location ^~ /s/ {
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-Proto $lite_nas_browser_proto;
    proxy_set_header Cookie $http_cookie;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_pass http://127.0.0.1:8083/;
}
