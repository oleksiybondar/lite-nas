# Included inside both LiteNAS server blocks when File Explorer is installed.
location = /apps/file-explorer {
    return 308 /apps/file-explorer/;
}

location ^~ /apps/file-explorer/assets/ {
    alias /usr/share/lite-nas/file-explorer/assets/;
    try_files $uri =404;
}

location ^~ /apps/file-explorer/ {
    alias /usr/share/lite-nas/file-explorer/;
    add_header Cache-Control no-store always;
    try_files $uri $uri/ /apps/file-explorer/index.html;
}
