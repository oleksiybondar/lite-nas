[http]
address=127.0.0.1:8083

[messaging]
url=tls://127.0.0.1:4222
client_name=stream-service
ca=/etc/lite-nas/certificates/transport/root-ca.crt
cert=/etc/lite-nas/certificates/transport/lite-nas-stream-service/client.crt
key=/etc/lite-nas/certificates/transport/lite-nas-stream-service/client.key
timeout=5s

[filesystem]
read_roots=/home
denied_paths=/bin,/boot,/dev,/etc,/lib,/lib64,/proc,/root,/run,/sbin,/snap,/sys,/usr,/var

[logging]
level=warn
format=rfc5424
output=file
file_path=/var/log/lite-nas/stream-service.log
